<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Tech reel — AI-планер</title>
<style>
  :root { --blue: #0a84ff; --muted: rgb(235 235 245 / 0.6); --faint: rgb(235 235 245 / 0.3); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; }
  body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px); background-size: 60px 60px; }
  .layer { position: absolute; left: 0; right: 0; }
  .grad { background: linear-gradient(120deg, #5b8cff, #a78bfa 50%, #ff8fa3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mono { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
  .orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9d6ff 0%, #5b8cff 28%, #a78bfa 58%, #ff8fa3 100%); display: grid; place-items: center; margin: 0 auto; }
  .bars { display: flex; gap: 10px; align-items: center; justify-content: center; height: 120px; margin-top: 36px; }
  .bars i { width: 12px; border-radius: 6px; background: linear-gradient(180deg, #5b8cff, #ff8fa3); display: block; }
  /* The phrase is laid out once, in full, from the first frame: typing only reveals letters,
     highlighting only paints behind them — so words never jump or re-wrap. */
  .phrase { font-size: 58px; line-height: 1.42; font-weight: 700; letter-spacing: -0.015em; padding: 0 80px; text-align: center; }
  .tok { border-radius: 12px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cursor { display: inline-block; width: 0; position: relative; }
  .cursor::after { content: ''; position: absolute; left: 2px; top: -50px; width: 5px; height: 62px; border-radius: 3px; background: #a78bfa; }
  .label { display: inline-block; font-size: 24px; font-weight: 700; padding: 6px 14px; border-radius: 10px; letter-spacing: 0.04em; }
  .code { margin: 0 80px; background: rgb(28 28 30 / 0.92); border: 1px solid rgb(255 255 255 / 0.08); border-radius: 32px; padding: 32px 40px; font-size: 32px; line-height: 1.6; }
  .k { color: #9da3ff; } .s { color: #7ee2a8; } .n { color: #ffb86b; } .p { color: var(--faint); }
  .day { margin: 0 80px; background: #0d0d0f; border: 1px solid rgb(255 255 255 / 0.08); border-radius: 36px; padding: 30px 30px 30px 0; position: relative; }
  .hour { display: flex; height: 110px; align-items: flex-start; }
  .hour b { width: 120px; text-align: right; padding-right: 22px; font-size: 26px; color: var(--faint); font-weight: 600; margin-top: -14px; }
  .hour span { flex: 1; border-top: 1px solid rgb(255 255 255 / 0.09); }
  .ev { position: absolute; left: 140px; right: 30px; border-radius: 18px; background: rgb(10 132 255 / 0.28); border-left: 8px solid var(--blue); padding: 16px 22px; }
  .notif { margin: 0 70px; background: rgb(44 44 46 / 0.96); border-radius: 36px; padding: 26px 30px; display: flex; gap: 22px; align-items: center; border: 1px solid rgb(255 255 255 / 0.1); box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); }
  .tg { width: 70px; height: 70px; border-radius: 18px; background: linear-gradient(180deg, #2aabee, #229ed9); display: grid; place-items: center; flex-shrink: 0; }
  .stat { text-align: center; }
  .stat .v { font-size: 170px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  .stat .l { font-size: 38px; color: var(--muted); font-weight: 600; margin-top: 10px; }
  .chip { display: inline-block; font-size: 44px; padding: 20px 36px; border-radius: 999px; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.14); font-weight: 600; margin: 12px; }
  .handle { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 18px; padding: 26px 46px; border-radius: 999px; background: linear-gradient(120deg, #5b8cff, #a78bfa 50%, #ff8fa3); color: #0b0b12; font-size: 50px; font-weight: 800; }
  .shine { position: absolute; top: -20%; bottom: -20%; width: 120px; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.75), transparent); transform: skewX(-20deg); }
  .letter { display: inline-block; }
</style>
</head>
<body>
  <div class="glow" id="g1" style="width:820px;height:820px;background:#5b8cff;opacity:.45;top:-300px;right:-300px"></div>
  <div class="glow" style="width:700px;height:700px;background:#ff8fa3;opacity:.28;bottom:-300px;left:-260px"></div>
  <div class="glow" style="width:520px;height:520px;background:#a78bfa;opacity:.25;top:42%;left:52%"></div>
  <div class="grid"></div>
  <div id="stage"></div>

<script>
  // Deterministic: the frame for second ?t= is drawn from scratch (no CSS animations).
  const t = Number(new URLSearchParams(location.search).get('t') ?? 0);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (from, to) => clamp((t - from) / (to - from));
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // overshoot
  const fade = (inA, inB, outA, outB) => Math.min(ease(p(inA, inB)), outA === undefined ? 1 : 1 - ease(p(outA, outB)));
  const hex2 = (v) => Math.round(clamp(v) * 255).toString(16).padStart(2, '0');
  const html = [];
  const layer = (top, opacity, inner, extra = '') =>
    opacity > 0.001 && html.push(`<div class="layer" style="top:${top}px;opacity:${opacity};${extra}">${inner}</div>`);

  // Speech: 0.5 … 4.5 s (the voice-over lasts 4 s); typing follows it evenly.
  const SPEAK_FROM = 0.5, SPEAK_TO = 4.5;
  const TOKENS = [
    ['Созвон с командой', '#0a84ff', 'СОБЫТИЕ', '«Созвон с командой»', 5.5],
    [' ', null],
    ['завтра', '#ff9f0a', 'ДАТА', 'завтра', 6.1],
    [' ', null],
    ['с 15 до 16', '#30d158', 'ВРЕМЯ', '15:00 – 16:00', 6.7],
    [' и ', null],
    ['напомни за час', '#ff6b9a', 'НАПОМНИТЬ', 'за 60 мин', 7.3],
  ];
  const TOTAL = TOKENS.reduce((n, x) => n + x[0].length, 0);

  // ---- scene A: speaking → parsing (0 … 10 s)
  const sceneA = fade(0, 0.4, 9.5, 10.0);
  if (sceneA > 0) {
    const speaking = t >= SPEAK_FROM && t < SPEAK_TO;
    const orbOp = fade(0, 0.4, 4.6, 5.1);
    const s = 1 + (speaking ? 0.05 * Math.sin(t * 9) : 0);
    const bars = Array.from({ length: 22 }, (_, i) => {
      const h = speaking ? 18 + Math.abs(Math.sin(t * 7 + i * 0.7) * Math.cos(t * 3.1 + i * 0.37)) * 100 : 14;
      return `<i style="height:${h}px;opacity:${speaking ? 1 : 0.4}"></i>`;
    }).join('');
    layer(300, orbOp * sceneA, `<div class="orb" style="transform:scale(${s})"><svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div><div class="bars">${bars}</div>`);

    // even typing, synced with the voice
    const typed = Math.floor(TOTAL * p(SPEAK_FROM, SPEAK_TO - 0.15));
    const cursorOn = t < SPEAK_TO + 0.4 && Math.floor(t * 3) % 2 === 0;
    let shown = 0;
    let cursorPlaced = false;
    const body = TOKENS.map(([text, color, , , at]) => {
      const vis = clamp(typed - shown, 0, text.length);
      shown += text.length;
      let inner = `<span>${text.slice(0, vis)}</span>`;
      if (!cursorPlaced && vis < text.length) {
        inner += cursorOn ? '<span class="cursor"></span>' : '';
        cursorPlaced = true;
      }
      inner += `<span style="color:transparent">${text.slice(vis)}</span>`;
      if (!color) return inner;
      const k = ease(p(at, at + 0.35));
      // background + spread shadow: looks padded, but takes no room (no re-wrap)
      return `<span class="tok" style="background:${color}${hex2(k * 0.25)};box-shadow:0 0 0 6px ${color}${hex2(k * 0.25)}, inset 0 -6px 0 ${color}${hex2(k)}">${inner}</span>`;
    }).join('');
    const tail = !cursorPlaced && cursorOn ? '<span class="cursor"></span>' : '';
    // after speaking, the same block (same line breaks) glides up
    const lift = 300 * inOut(p(4.7, 5.4));
    layer(730 - lift, sceneA, `<div class="phrase">«${body}${tail}<span style="opacity:${typed >= TOTAL ? 1 : 0}">»</span></div>`);

    if (t >= 5.3) {
      const lines = TOKENS.filter((x) => x[1]).map(([, color, label, value, at]) => {
        const k = ease(p(at + 0.1, at + 0.5));
        return `<div style="display:flex;align-items:center;gap:20px;margin:14px 0;opacity:${k};transform:translateX(${(1 - k) * 60}px)">
          <span class="label" style="background:${color}33;color:${color}">${label}</span><span style="font-size:36px;font-weight:600">${value}</span></div>`;
      }).join('');
      layer(770, sceneA, `<div style="margin:0 80px">${lines}</div>`);
      const codeOp = ease(p(8.0, 8.5));
      const code = `<span class="p">{</span><br>&nbsp;&nbsp;<span class="k">"type"</span><span class="p">:</span> <span class="s">"event"</span><span class="p">,</span><br>&nbsp;&nbsp;<span class="k">"start"</span><span class="p">:</span> <span class="s">"15:00"</span><span class="p">,</span> <span class="k">"end"</span><span class="p">:</span> <span class="s">"16:00"</span><span class="p">,</span><br>&nbsp;&nbsp;<span class="k">"remind"</span><span class="p">:</span> <span class="n">-60</span><br><span class="p">}</span>`;
      layer(1110, sceneA * codeOp, `<div class="code mono" style="transform:translateY(${(1 - codeOp) * 40}px)">${code}</div>`);
    }
  }

  // ---- scene B: into the day (9.8 … 13.2 s)
  const sceneB = fade(9.8, 10.3, 12.8, 13.3);
  if (sceneB > 0) {
    const hours = [13, 14, 15, 16, 17, 18].map((h) => `<div class="hour"><b>${h}:00</b><span></span></div>`).join('');
    const drop = ease(p(10.3, 11.0));
    const ev = `<div class="ev" style="top:${30 + 2 * 110 + (1 - drop) * -260}px;height:110px;opacity:${drop};transform:scale(${0.92 + 0.08 * drop})">
      <div style="font-size:34px;font-weight:700">Созвон с командой</div><div style="font-size:26px;color:rgb(160 200 255)">15:00 – 16:00 · 🔔 за 1 ч</div></div>`;
    layer(470, sceneB, `<div style="margin:0 80px 26px;font-size:44px;font-weight:800;letter-spacing:-0.02em">Завтра</div><div class="day">${hours}${ev}</div>`, `transform:translateY(${(1 - ease(p(9.8, 10.4))) * 60}px)`);
    const n = ease(p(11.4, 11.9));
    layer(290 - (1 - n) * 160, sceneB * n, `<div class="notif"><span class="tg"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5Z"/></svg></span>
      <div><div style="font-size:26px;color:var(--muted)">Планер · сейчас</div><div style="font-size:32px;font-weight:700;margin-top:4px">⏰ Напомню за 1 час до созвона</div></div></div>`);
  }

  // ---- scene C: numbers + three phrases, slowly (13.1 … 16.6 s)
  const sceneC = fade(13.1, 13.5, 16.2, 16.6);
  if (sceneC > 0) {
    const a = ease(p(13.2, 13.7));
    const b = ease(p(13.6, 14.1));
    layer(420, sceneC, `<div style="display:flex;justify-content:space-around;margin:0 60px">
      <div class="stat" style="opacity:${a};transform:translateY(${(1 - a) * 40}px)"><div class="v grad">0,4с</div><div class="l">на разбор фразы</div></div>
      <div class="stat" style="opacity:${b};transform:translateY(${(1 - b) * 40}px)"><div class="v grad">0</div><div class="l">нажатий</div></div></div>`);
    const chips = ['полвосьмого', 'смены 2 через 2', 'перенеси на час позже'];
    const ch = chips.map((c, i) => {
      const k = ease(p(14.3 + i * 0.45, 14.75 + i * 0.45));
      return `<div><span class="chip" style="opacity:${k};transform:translateY(${(1 - k) * 30}px) scale(${0.9 + 0.1 * k})">«${c}»</span></div>`;
    }).join('');
    layer(830, sceneC, `<div style="text-align:center">${ch}</div>`);
  }

  // ---- scene D: the finale (16.5 … 20 s) — rings, the icon drawing itself, a sparkle, letters
  const T0 = 16.5;
  if (t >= T0 - 0.05) {
    const cx = 540, cy = 690;
    // light rings
    const rings = [0, 0.25, 0.5].map((d) => {
      const k = p(T0 + d, T0 + d + 1.6);
      if (k <= 0 || k >= 1) return '';
      const r = 120 + ease(k) * 560;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${6 * (1 - k) + 1}" opacity="${(1 - k) * 0.8}"/>`;
    }).join('');
    // particles
    const parts = Array.from({ length: 18 }, (_, i) => {
      const k = p(T0 + 0.45, T0 + 1.6);
      if (k <= 0 || k >= 1) return '';
      const ang = (i / 18) * Math.PI * 2 + 0.3;
      const dist = 150 + ease(k) * (240 + (i % 3) * 70);
      return `<circle cx="${cx + Math.cos(ang) * dist}" cy="${cy + Math.sin(ang) * dist}" r="${(1 - k) * (5 + (i % 3) * 2)}" fill="${['#5b8cff', '#a78bfa', '#ff8fa3'][i % 3]}" opacity="${1 - k}"/>`;
    }).join('');
    html.push(`<svg style="position:absolute;inset:0" width="1080" height="1920"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff8fa3"/></linearGradient></defs>${rings}${parts}</svg>`);

    // the icon: tile springs in, the calendar strokes draw, the sparkle pops
    const tile = back(clamp(p(T0, T0 + 0.6)));
    const draw = ease(p(T0 + 0.25, T0 + 1.0));
    const spark = back(clamp(p(T0 + 0.85, T0 + 1.25)));
    const float = t > T0 + 1.6 ? Math.sin((t - T0) * 2.2) * 6 : 0;
    const glowPulse = 0.5 + 0.25 * Math.sin((t - T0) * 3);
    if (tile > 0) {
      layer(cy - 130 + float, 1, `<div style="width:260px;height:260px;margin:0 auto;border-radius:64px;background:linear-gradient(135deg,#5b8cff,#a78bfa 52%,#ff8fa3);transform:scale(${tile}) rotate(${(1 - clamp(tile)) * -12}deg);box-shadow:0 0 ${80 + 60 * glowPulse}px rgb(167 139 250 / ${0.35 + 0.25 * glowPulse});display:grid;place-items:center">
        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5.5" width="17" height="15" rx="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - draw * 100}"/>
          <path d="M8.5 3.5v3.5M15.5 3.5v3.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - draw * 100}"/>
          <path d="M12 9.6c.25 2.1 1.3 3.2 4 4.2-2.7 1-3.75 2.1-4 4.2-.25-2.1-1.3-3.2-4-4.2 2.7-1 3.75-2.1 4-4.2Z" fill="#fff" stroke="none" style="transform-origin:12px 13.8px;transform:scale(${spark})"/>
        </svg></div>`);
    }

    // title: letters rise in one by one, the gradient part shimmers
    const word1 = 'AI-планер';
    const letters = [...word1].map((ch, i) => {
      const k = ease(p(T0 + 1.0 + i * 0.05, T0 + 1.4 + i * 0.05));
      return `<span class="letter" style="opacity:${k};transform:translateY(${(1 - k) * 40}px);filter:blur(${(1 - k) * 8}px)">${ch}</span>`;
    }).join('');
    const k2 = ease(p(T0 + 1.5, T0 + 2.0));
    const shimmer = 100 - ((t - T0) * 60) % 300;
    const title = `<div style="text-align:center;font-size:96px;font-weight:800;letter-spacing:-0.035em;line-height:1.05">${letters}<span style="display:inline-block;opacity:${k2};transform:translateY(${(1 - k2) * 30}px);background:linear-gradient(120deg,#5b8cff,#a78bfa 30%,#fff 45%,#ff8fa3 60%,#a78bfa);background-size:300% 100%;background-position:${shimmer}% 0;-webkit-background-clip:text;background-clip:text;color:transparent">&nbsp;в&nbsp;Telegram</span></div>`;
    layer(1000, 1, title);
    const sub = ease(p(T0 + 1.9, T0 + 2.4));
    layer(1135, sub, `<div style="text-align:center;font-size:40px;color:var(--muted);font-weight:500;transform:translateY(${(1 - sub) * 20}px)">Скажи — и всё уже в календаре</div>`);
    // the handle slides up; a light sweep passes over it
    const h = back(clamp(p(T0 + 2.2, T0 + 2.75)));
    const sweep = p(T0 + 2.8, T0 + 3.4);
    if (h > 0) {
      layer(1250, clamp(h), `<div style="text-align:center;transform:translateY(${(1 - h) * 60}px)"><span class="handle"><svg width="50" height="50" viewBox="0 0 24 24" fill="#0b0b12"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5Z"/></svg>@myliveplaners_bot<span class="shine" style="left:${-160 + sweep * 760}px;opacity:${sweep > 0 && sweep < 1 ? 1 : 0}"></span></span></div>`);
    }
  }

  document.getElementById('stage').innerHTML = html.join('');
</script>
</body>
</html>
