<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Tech reel — AI-планер</title>
<style>
  :root { --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --pink: #ff6b9a; --violet: #bf5af2; --muted: rgb(235 235 245 / 0.6); --faint: rgb(235 235 245 / 0.3); --surface: #1c1c1e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; }
  body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px); background-size: 60px 60px; }
  .layer { position: absolute; left: 0; right: 0; }
  .grad { background: linear-gradient(120deg, #5b8cff, #a78bfa 50%, #ff8fa3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.12); font-size: 28px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #a78bfa; }
  .mono { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
  .orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9d6ff 0%, #5b8cff 28%, #a78bfa 58%, #ff8fa3 100%); display: grid; place-items: center; margin: 0 auto; }
  .bars { display: flex; gap: 10px; align-items: center; justify-content: center; height: 120px; margin-top: 40px; }
  .bars i { width: 12px; border-radius: 6px; background: linear-gradient(180deg, #5b8cff, #ff8fa3); display: block; }
  .phrase { font-size: 58px; line-height: 1.32; font-weight: 700; letter-spacing: -0.015em; padding: 0 80px; text-align: center; }
  .tok { border-radius: 14px; padding: 0 6px; white-space: nowrap; }
  .label { display: inline-block; font-size: 24px; font-weight: 700; padding: 6px 14px; border-radius: 10px; letter-spacing: 0.04em; }
  .code { margin: 0 80px; background: rgb(28 28 30 / 0.92); border: 1px solid rgb(255 255 255 / 0.08); border-radius: 32px; padding: 34px 40px; font-size: 32px; line-height: 1.6; }
  .k { color: #9da3ff; } .s { color: #7ee2a8; } .n { color: #ffb86b; } .p { color: var(--faint); }
  .day { margin: 0 80px; background: #0d0d0f; border: 1px solid rgb(255 255 255 / 0.08); border-radius: 36px; padding: 30px 30px 30px 0; position: relative; }
  .hour { display: flex; height: 110px; align-items: flex-start; }
  .hour b { width: 120px; text-align: right; padding-right: 22px; font-size: 26px; color: var(--faint); font-weight: 600; margin-top: -14px; }
  .hour span { flex: 1; border-top: 1px solid rgb(255 255 255 / 0.09); }
  .ev { position: absolute; left: 140px; right: 30px; border-radius: 18px; background: rgb(10 132 255 / 0.28); border-left: 8px solid var(--blue); padding: 16px 22px; }
  .notif { margin: 0 70px; background: rgb(44 44 46 / 0.96); border-radius: 36px; padding: 26px 30px; display: flex; gap: 22px; align-items: center; border: 1px solid rgb(255 255 255 / 0.1); box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); }
  .tg { width: 70px; height: 70px; border-radius: 18px; background: linear-gradient(180deg, #2aabee, #229ed9); display: grid; place-items: center; flex-shrink: 0; }
  .stat { text-align: center; }
  .stat .v { font-size: 170px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  .stat .l { font-size: 38px; color: var(--muted); font-weight: 600; margin-top: 10px; }
  .chip { display: inline-block; font-size: 34px; padding: 16px 28px; border-radius: 999px; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.12); font-weight: 600; margin: 8px; }
  .icon { width: 230px; height: 230px; border-radius: 56px; background: linear-gradient(135deg, #5b8cff, #a78bfa 52%, #ff8fa3); display: grid; place-items: center; margin: 0 auto; }
  .handle { display: inline-flex; align-items: center; gap: 18px; padding: 26px 44px; border-radius: 999px; background: linear-gradient(120deg, #5b8cff, #a78bfa 50%, #ff8fa3); color: #0b0b12; font-size: 50px; font-weight: 800; }
</style>
</head>
<body>
  <div class="glow" style="width:820px;height:820px;background:#5b8cff;opacity:.45;top:-300px;right:-300px"></div>
  <div class="glow" style="width:700px;height:700px;background:#ff8fa3;opacity:.28;bottom:-300px;left:-260px"></div>
  <div class="glow" style="width:520px;height:520px;background:#a78bfa;opacity:.25;top:42%;left:52%"></div>
  <div class="grid"></div>
  <div id="stage"></div>

<script>
  // Deterministic: the frame for second ?t= is drawn from scratch (no CSS animations).
  const t = Number(new URLSearchParams(location.search).get('t') ?? 0);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (from, to) => clamp((t - from) / (to - from)); // progress of a time window
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const fade = (inA, inB, outA, outB) => Math.min(ease(p(inA, inB)), outA === undefined ? 1 : 1 - ease(p(outA, outB)));
  const S = document.getElementById('stage');
  const html = [];
  const layer = (top, opacity, inner, extra = '') =>
    opacity > 0.001 && html.push(`<div class="layer" style="top:${top}px;opacity:${opacity};${extra}">${inner}</div>`);

  const PHRASE = 'Созвон с командой завтра с 15 до 16 и напомни за час';
  // tokens: [text, color, label, value, start time of highlight]
  const TOKENS = [
    ['Созвон с командой', '#0a84ff', 'СОБЫТИЕ', '«Созвон с командой»', 5.0],
    [' ', null],
    ['завтра', '#ff9f0a', 'ДАТА', 'завтра', 5.6],
    [' ', null],
    ['с 15 до 16', '#30d158', 'ВРЕМЯ', '15:00 – 16:00', 6.2],
    [' и ', null],
    ['напомни за час', '#ff6b9a', 'НАПОМНИТЬ', 'за 60 мин', 6.8],
  ];

  // header (always) — stays below Reels' top bar
  const headerOp = fade(0, 0.5, 15.2, 15.6);
  layer(260, headerOp, `<div style="text-align:center"><span class="pill"><span class="dot"></span>${t < 4.6 ? 'Говорите как обычно' : t < 9.2 ? 'AI разбирает фразу' : t < 12.6 ? 'Готово за 0,4 секунды' : 'Понимает живую речь'}</span></div>`);

  // ---- scene 1+2: the phrase (typed while speaking, then parsed)
  const sceneA = fade(0, 0.4, 9.0, 9.5);
  if (sceneA > 0) {
    // orb + waveform while "speaking"
    const speaking = t < 3.4;
    const orbOp = fade(0, 0.4, 3.6, 4.2);
    const s = 1 + (speaking ? 0.05 * Math.sin(t * 9) : 0);
    const bars = Array.from({ length: 22 }, (_, i) => {
      const h = speaking ? 18 + Math.abs(Math.sin(t * 7 + i * 0.7) * Math.cos(t * 3.1 + i * 0.37)) * 100 : 14;
      return `<i style="height:${h}px;opacity:${speaking ? 1 : 0.4}"></i>`;
    }).join('');
    layer(420, orbOp * sceneA, `<div class="orb" style="transform:scale(${s})"><svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div><div class="bars">${bars}</div>`);

    // typed transcript → tokens
    const typed = Math.floor(PHRASE.length * ease(p(0.4, 3.2)));
    const phraseTop = 420 + (1 - 0) * 0 + 440 * 0 + (t < 3.6 ? 400 : 400 - 230 * inOut(p(3.6, 4.4)));
    let inner;
    if (t < 4.6) {
      inner = `${PHRASE.slice(0, typed)}<span style="opacity:${t < 3.4 && Math.floor(t * 3) % 2 ? 1 : 0};color:#a78bfa">|</span>`;
    } else {
      inner = TOKENS.map(([text, color, , , at]) => {
        if (!color) return text;
        const k = ease(p(at, at + 0.35));
        return `<span class="tok" style="background:${color}${Math.round(k * 0x40).toString(16).padStart(2, '0')};box-shadow:inset 0 -6px 0 ${color}${Math.round(k * 255).toString(16).padStart(2, '0')}">${text}</span>`;
      }).join('');
    }
    layer(phraseTop, sceneA, `<div class="phrase">«${inner}»</div>`);

    // labels + structured result
    if (t >= 4.8) {
      const lines = TOKENS.filter((x) => x[1]).map(([, color, label, value, at]) => {
        const k = ease(p(at + 0.1, at + 0.5));
        return `<div style="display:flex;align-items:center;gap:20px;margin:12px 0;opacity:${k};transform:translateX(${(1 - k) * 60}px)">
          <span class="label" style="background:${color}33;color:${color}">${label}</span><span style="font-size:34px;font-weight:600">${value}</span></div>`;
      }).join('');
      layer(830, sceneA, `<div style="margin:0 80px">${lines}</div>`);
      const codeOp = ease(p(7.5, 8.0));
      const code = `<span class="p">{</span><br>&nbsp;&nbsp;<span class="k">"type"</span><span class="p">:</span> <span class="s">"event"</span><span class="p">,</span><br>&nbsp;&nbsp;<span class="k">"start"</span><span class="p">:</span> <span class="s">"15:00"</span><span class="p">,</span> <span class="k">"end"</span><span class="p">:</span> <span class="s">"16:00"</span><span class="p">,</span><br>&nbsp;&nbsp;<span class="k">"remind"</span><span class="p">:</span> <span class="n">-60</span><br><span class="p">}</span>`;
      layer(1150, sceneA * codeOp, `<div class="code mono" style="transform:translateY(${(1 - codeOp) * 40}px)">${code}</div>`);
    }
  }

  // ---- scene 3: into the day
  const sceneB = fade(9.3, 9.8, 12.4, 12.9);
  if (sceneB > 0) {
    const hours = [13, 14, 15, 16, 17, 18].map((h) => `<div class="hour"><b>${h}:00</b><span></span></div>`).join('');
    const drop = ease(p(9.8, 10.5));
    const ev = `<div class="ev" style="top:${30 + 2 * 110 + (1 - drop) * -260}px;height:110px;opacity:${drop};transform:scale(${0.92 + 0.08 * drop})">
      <div style="font-size:34px;font-weight:700">Созвон с командой</div><div style="font-size:26px;color:rgb(160 200 255)">15:00 – 16:00 · 🔔 за 1 ч</div></div>`;
    layer(470, sceneB, `<div style="margin:0 80px 26px;font-size:44px;font-weight:800;letter-spacing:-0.02em">Завтра</div><div class="day">${hours}${ev}</div>`, `transform:translateY(${(1 - ease(p(9.3, 9.9))) * 60}px)`);
    const n = ease(p(10.9, 11.4));
    layer(330 - (1 - n) * 160, sceneB * n, `<div class="notif"><span class="tg"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5Z"/></svg></span>
      <div><div style="font-size:26px;color:var(--muted)">Планер · сейчас</div><div style="font-size:32px;font-weight:700;margin-top:4px">⏰ Напомню за 1 час до созвона</div></div></div>`);
  }

  // ---- scene 4: numbers + phrases it understands
  const sceneC = fade(12.7, 13.1, 15.0, 15.4);
  if (sceneC > 0) {
    const a = ease(p(12.8, 13.3));
    const b = ease(p(13.2, 13.7));
    layer(430, sceneC, `<div style="display:flex;justify-content:space-around;margin:0 60px">
      <div class="stat" style="opacity:${a};transform:translateY(${(1 - a) * 40}px)"><div class="v grad">0,4с</div><div class="l">на разбор фразы</div></div>
      <div class="stat" style="opacity:${b};transform:translateY(${(1 - b) * 40}px)"><div class="v grad">0</div><div class="l">нажатий</div></div></div>`);
    const chips = ['полвосьмого', 'на выходных', 'смены 2/2', 'перенеси на час позже', 'каждый второй вторник', 'напомни через 5 минут'];
    const ch = chips.map((c, i) => {
      const k = ease(p(13.6 + i * 0.12, 14.0 + i * 0.12));
      return `<span class="chip" style="opacity:${k};transform:scale(${0.85 + 0.15 * k})">«${c}»</span>`;
    }).join('');
    layer(860, sceneC, `<div style="text-align:center;padding:0 60px">${ch}</div>`);
  }

  // ---- scene 5: CTA
  const sceneD = ease(p(15.3, 15.9));
  if (sceneD > 0) {
    layer(470, sceneD, `<div class="icon" style="transform:scale(${0.85 + 0.15 * sceneD})"><svg width="130" height="130" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="4"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5"/><path d="M12 9.6c.25 2.1 1.3 3.2 4 4.2-2.7 1-3.75 2.1-4 4.2-.25-2.1-1.3-3.2-4-4.2 2.7-1 3.75-2.1 4-4.2Z" fill="#fff" stroke="none"/></svg></div>`);
    const b = ease(p(15.6, 16.2));
    layer(790, b, `<div style="text-align:center;padding:0 70px"><div style="font-size:92px;font-weight:800;letter-spacing:-0.035em;line-height:1.05">AI-планер <span class="grad">в Telegram</span></div>
      <div style="font-size:40px;color:var(--muted);margin-top:22px;font-weight:500">Скажи — и всё уже в календаре</div>
      <div style="margin-top:56px"><span class="handle"><svg width="50" height="50" viewBox="0 0 24 24" fill="#0b0b12"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5Z"/></svg>@myliveplaners_bot</span></div></div>`);
  }

  S.innerHTML = html.join('');
</script>
</body>
</html>
