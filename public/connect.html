<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Подключить обои — ПЛАН</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --fg: #000; --muted: #6e6e73; --blue: #007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #fff; --muted: #98989f; --blue: #0a84ff; } }
  * { box-sizing: border-box; margin: 0; }
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 26px; margin: 16px 0 8px; }
  p { color: var(--muted); font-size: 15px; }
  a.btn { display: block; margin: 24px 0 12px; padding: 15px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 600; text-decoration: none; }
  .err { color: #ff3b30; }
  .icon { font-size: 52px; }
</style>
</head>
<body>
<main>
  <div class="icon">🖼</div>
  <h1>Подключить обои</h1>
  <p id="hint">Откроются «Команды» — разрешите запуск, и на экране блокировки появятся ваши планы и задачи.</p>
  <a class="btn" id="go" href="#">Подключить</a>
  <p>Команда «Обои ПЛАН» должна быть уже установлена.</p>
</main>
<script>
  // The personal link comes in the #fragment, so it never reaches any server log.
  const link = decodeURIComponent(location.hash.slice(1));
  const go = document.getElementById('go');
  if (!/^https:\/\/[\w.-]+\/wallpaper\/[0-9a-f]{20,64}\.jpg$/.test(link)) {
    document.getElementById('hint').textContent = 'Ссылка не распознана. Откройте планер в Telegram → Настройки → «Обои экрана блокировки» → «Подключить».';
    document.getElementById('hint').className = 'err';
    go.style.display = 'none';
  } else {
    go.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Обои ПЛАН') + '&input=text&text=' + encodeURIComponent(link);
    setTimeout(() => { location.href = go.href; }, 300);
  }
</script>
</body>
</html>
