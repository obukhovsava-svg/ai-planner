<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lock screen wallpaper — ПЛАН</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #111; display: flex; gap: 30px; padding: 30px; width: max-content; }
  .wp { position: relative; width: 402px; height: 874px; overflow: hidden; flex-shrink: 0; color: #fff; }
  .bg { position: absolute; inset: 0; }
  .card { position: absolute; border-radius: 22px; overflow: hidden; }
  .glass { background: rgb(18 18 24 / 0.52); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.14); }
  /* week */
  .week { left: 14px; right: 14px; top: 262px; height: 122px; display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 6px 6px; gap: 4px; }
  .day { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .wd { font-size: 10px; font-weight: 600; opacity: .62; }
  .dn { font-size: 15px; font-weight: 700; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; margin: 1px 0 4px; }
  .chip { width: 100%; border-radius: 6px; padding: 2px 3px 2px 5px; margin-bottom: 2px; position: relative; font-size: 7.6px; line-height: 1.2; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip i { font-style: normal; display: block; font-size: 7px; font-weight: 600; opacity: .75; }
  .chip.task { background: rgb(255 255 255 / 0.1); }
  .more { font-size: 8px; font-weight: 700; opacity: .5; margin-top: 1px; }
  /* groups */
  .grp { width: 182px; height: 150px; padding: 11px 12px; }
  .gh { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
  .gh svg { flex-shrink: 0; }
  .badge { margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; padding: 0 6px; }
  .row { display: flex; align-items: center; gap: 7px; height: 24px; font-size: 13.5px; font-weight: 500; }
  .row .c { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; flex-shrink: 0; }
  .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .row .d { font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .gmore { font-size: 12px; font-weight: 600; opacity: .5; margin-top: 2px; }
  /* preview-only iOS chrome */
  .ios { position: absolute; left: 0; right: 0; text-align: center; color: rgb(255 255 255 / 0.92); pointer-events: none; }
  .half { top: 262px; width: 182px; height: 428px; padding: 12px 10px 10px 12px; }
  .hh { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .cnt { margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: rgb(255 255 255 / 0.16); }
  .ev { display: flex; gap: 7px; padding: 5px 6px 5px 0; margin: 0 0 4px -4px; padding-left: 4px; border-radius: 10px; }
  .ev .bar { width: 3.5px; border-radius: 2px; flex-shrink: 0; }
  .evt { min-width: 0; }
  .evn { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evtime { font-size: 11px; font-weight: 500; opacity: .75; margin-top: 1px; }
  .tk { display: flex; align-items: center; gap: 7px; height: 40px; border-bottom: 0.5px solid rgb(255 255 255 / 0.1); }
  .tk:last-child { border: 0; }
  .tk .c { width: 16px; height: 16px; border-radius: 50%; border: 1.8px solid rgb(255 255 255 / .7); flex-shrink: 0; display: grid; place-items: center; }
  .tn { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .td { font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
  .label { position: absolute; left: 0; right: 0; bottom: -26px; text-align: center; color: #aaa; font-size: 13px; }
</style>
</head>
<body>
<div id="A" class="wp"></div>
<div id="B" class="wp"></div>
<div id="Ap" class="wp"></div>
<div id="Bp" class="wp"></div>
<script>
// Sample: Saturday 10 Oct, 17:15
const C = { blue: '#0a84ff', red: '#ff453a', violet: '#bf5af2', green: '#30d158', amber: '#ff9f0a' };
const plans = [
  { s: '09:30', e: '10:30', n: 'Планёрка', c: 'blue', past: true },
  { s: '12:00', e: '15:00', n: 'Поездка за город', c: 'green', past: true },
  { s: '17:00', e: '18:00', n: 'Созвон с командой', c: 'blue', now: true },
  { s: '19:00', e: '20:30', n: 'Тренировка', c: 'red' },
  { s: '21:00', e: '22:00', n: 'Ужин с родителями', c: 'violet' },
];
const tasks = [
  { n: 'Сдать отчёт', d: 'вчера', late: true, hi: true },
  { n: 'Оплатить интернет', d: '18:00' },
  { n: 'Купить продукты', d: '' },
  { n: 'Позвонить маме', d: '', done: true },
  { n: 'Забрать посылку', d: '20:00' },
  { n: 'Полить цветы', d: '' },
  { n: 'Записаться к врачу', d: '' },
];
const brand = 'linear-gradient(135deg,#7a9dfe,#a48bfa 52%,#f48eae)';
const MAXP = 7, MAXT = 9;

function render(el, variant, preview) {
  const B = variant === 'B';
  const bg = B
    ? `<div class="bg" style="background:radial-gradient(120% 70% at 80% 0%,#3b3a8f 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#7a3d6e 0%,transparent 60%),linear-gradient(180deg,#0d1025,#141433 55%,#1d1230)"></div>`
    : `<div class="bg" style="background:radial-gradient(90% 50% at 70% 25%,#e8a05c 0%,transparent 55%),linear-gradient(180deg,#2f4f73 0%,#5b7aa0 35%,#c98a5a 62%,#3b2a2a 100%)"></div>`;
  const cardCls = 'card glass' + (B ? ' brand' : '');
  const accent = B ? '#a9bcff' : '#fff';
  const head = (icon, title, n) => `<div class="hh">${icon}<span>${title}</span><span class="cnt">${n}</span></div>`;
  const calIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`;
  const chkIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12.5 3 3 5-6.5"/></svg>`;
  const pl = plans.slice(0, MAXP).map((p) => {
    const col = C[p.c];
    return `<div class="ev${p.now ? ' now' : ''}" style="${p.now ? `background:${col}38;` : ''}opacity:${p.past ? 0.45 : 1}">
      <span class="bar" style="background:${col}"></span>
      <div class="evt"><div class="evn">${p.n}</div><div class="evtime">${p.now ? `<b style="color:${col === C.blue ? '#64b5ff' : col}">сейчас</b> · до ${p.e}` : `${p.s} – ${p.e}`}</div></div></div>`;
  }).join('');
  const tk = tasks.slice(0, MAXT).map((t) => `<div class="tk" style="opacity:${t.done ? 0.45 : 1}">
      <span class="c" style="${t.done ? `background:${B ? '#a48bfa' : '#fff'};border-color:transparent` : t.late ? 'border-color:#ff453a' : ''}">${t.done ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="${B ? '#fff' : '#000'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>` : ''}</span>
      <span class="tn" style="${t.done ? 'text-decoration:line-through' : ''}">${t.hi && !t.done ? '<b style="color:#ff453a">!</b> ' : ''}${t.n}</span>
      ${t.d ? `<span class="td" style="color:${t.late ? '#ff453a' : 'rgb(255 255 255 / .6)'}">${t.d}</span>` : ''}</div>`).join('');
  const brandEdge = B ? `<style>#${el.id} .brand{box-shadow:inset 0 0 0 0.5px rgb(255 255 255 / 0.14),0 0 0 0.75px rgb(164 139 250 / 0.35),0 10px 30px rgb(40 30 90 / 0.35)}</style>` : '';
  const ios = preview
    ? `<div class="ios" style="top:52px;font-size:20px;font-weight:600">Сб, 10 октября</div>
       <div class="ios" style="top:66px;font-size:112px;font-weight:700;letter-spacing:-2px;font-family:system-ui">17:15</div>
       <div style="position:absolute;left:46px;bottom:44px;width:50px;height:50px;border-radius:50%;background:rgb(0 0 0 / .35)"></div>
       <div style="position:absolute;right:46px;bottom:44px;width:50px;height:50px;border-radius:50%;background:rgb(0 0 0 / .35)"></div>
       <div style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff"></div>`
    : '';
  const done = tasks.filter((t) => t.done).length;
  el.innerHTML = brandEdge + bg +
    `<div class="${cardCls} half" style="left:14px">${head(calIcon, 'Планы', plans.filter((p) => !p.past).length)}${pl}</div>` +
    `<div class="${cardCls} half" style="left:206px">${head(chkIcon, 'Задачи', `${done}/${tasks.length}`)}${tk}</div>` +
    `<div style="position:absolute;right:20px;top:696px;font-size:9px;font-weight:600;color:rgb(255 255 255 / .45)">ПЛАН · обновлено 17:15</div>` + ios;
}
render(document.getElementById('A'), 'A', false);
render(document.getElementById('B'), 'B', false);
render(document.getElementById('Ap'), 'A', true);
render(document.getElementById('Bp'), 'B', true);
</script>
</body>
</html>
